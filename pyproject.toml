[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexonit-llm"
version = "0.1.0"
description = "Ultra-fast local LLM inference with zero-config hardware-optimized speculative decoding."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Hexonithy Studios", email = "metesezer54@gmail.com"},
]
keywords = ["llm", "inference", "speculative-decoding", "vllm", "llamacpp", "ai", "local-llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.20.0",
  "psutil>=5.9.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.0"]
llamacpp = ["llama-cpp-python>=0.2.0"]
cloud = ["httpx>=0.27.0"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "black>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/met1yann/hexonit-llm"
Repository = "https://github.com/met1yann/hexonit-llm"
"Bug Tracker" = "https://github.com/met1yann/hexonit-llm/issues"
Changelog = "https://github.com/met1yann/hexonit-llm/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"